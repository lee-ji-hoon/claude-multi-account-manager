name: Test

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash tests/test_hooks_shell.sh
      - run: bash tests/test_install_shell.sh
      - run: bash -n install.sh hooks-handlers/session-start.sh hooks-handlers/prompt-submit.sh
